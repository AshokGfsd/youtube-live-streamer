name: Build Android ZIP

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-Android
          path: dist/android/StreamForge-Android/
          include-hidden-files: true

<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131d2b"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8997a8"/>
      <stop offset=".10" stop-color="#353d4c"/>
      <stop offset=".53" stop-color="#111620"/>
      <stop offset=".90" stop-color="#353d4c"/>
      <stop offset="1" stop-color="#9ba6b2"/>
    </linearGradient>
    <mask id="screen-cutout">
      <rect width="540" height="960" fill="#fff"/>
      <rect x="43" y="29" width="454" height="902" rx="43" fill="#000"/>
    </mask>
  </defs>

  <!-- Everything outside the rounded screen is opaque. The screen itself
       is transparent so the live Reel passes through the phone frame. -->
  <g mask="url(#screen-cutout)">
    <rect width="540" height="960" fill="url(#backdrop)"/>
    <rect x="23" y="9" width="494" height="942" rx="62" fill="url(#edge)"/>
    <rect x="28" y="14" width="484" height="932" rx="57" fill="#06080d"/>
    <rect x="35" y="21" width="470" height="918" rx="51" fill="#202735"/>
    <rect x="40" y="26" width="460" height="908" rx="46" fill="#020306"/>
  </g>

  <!-- Subtle physical iPhone-style details, over the live video. -->
  <rect x="205" y="37" width="130" height="36" rx="18" fill="#030305"/>
  <circle cx="319" cy="55" r="5" fill="#1c2636"/>
  <rect x="207" y="904" width="126" height="5" rx="2.5" fill="#ffffff" opacity=".82"/>
  <rect x="20" y="199" width="3" height="58" rx="1.5" fill="#717a87"/>
  <rect x="20" y="272" width="3" height="58" rx="1.5" fill="#717a87"/>
  <rect x="517" y="261" width="3" height="86" rx="1.5" fill="#717a87"/>
</svg>
